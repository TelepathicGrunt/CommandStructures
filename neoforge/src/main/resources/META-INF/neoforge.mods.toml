modLoader="javafml"
loaderVersion="[4,)"
license="MIT"
issueTrackerURL="${issues_url}"
sourcesUrl="${sources_url}"

[[mods]]
    modId="${mod_id}"
    version="${version}"
    displayName="${mod_display_name}"
    displayURL="${homepage_url}"
    bannerFile="commandstructures.png"
    iconFile="commandstructures.png"
    authors="TelepathicGrunt"
    description='''${mod_description}'''

[[mixins]]
    config = "command_structures.mixins.json"

[dependencies]
"${mod_id}" = [
    { modId = "neoforge", type = "required", versionRange = "*", ordering = "NONE", side = "BOTH" },
    { modId = "minecraft", type = "required", versionRange = "[${minecraft_version},)", ordering = "NONE", side = "BOTH" },
]